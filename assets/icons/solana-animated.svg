<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="solana"><title>solana</title><desc>Solana’s gradient bars slide in sequence; the middle bar moves in the opposite direction.</desc><defs><linearGradient id="solana-brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14f195" /><stop offset="1" stop-color="#9945ff" /></linearGradient><style>@keyframes solana-transaction-0 {0%,15%,65%,100%{transform:translateX(0)}38%{transform:translateX(0.6px)}}
@keyframes solana-transaction-1 {0%,15%,65%,100%{transform:translateX(0)}38%{transform:translateX(-0.6px)}}
@keyframes solana-transaction-2 {0%,15%,65%,100%{transform:translateX(0)}38%{transform:translateX(0.6px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .motion-trail { opacity: 0; } }</style></defs><g transform="translate(10 10) scale(4.5)" fill="#334155"><polygon points="4,2 23,2 19,6 0,6" fill="url(#solana-brand)" style="animation:solana-transaction-0 6s ease-in-out 0.0s infinite;" /><polygon points="0,10 19,10 23,14 4,14" fill="url(#solana-brand)" style="animation:solana-transaction-1 6s ease-in-out -0.6s infinite;" /><polygon points="4,18 23,18 19,22 0,22" fill="url(#solana-brand)" style="animation:solana-transaction-2 6s ease-in-out -1.2s infinite;" /></g></svg>
