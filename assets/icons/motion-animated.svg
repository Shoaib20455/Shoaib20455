<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .draw {
      fill: transparent;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: draw-motion-default 3s linear infinite;
    }
      @keyframes draw-motion-0 {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; fill: #0B0B0C; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: #0B0B0C; }
      }
      @keyframes draw-motion-1 {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; fill: #FFFFFF; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: #FFFFFF; }
      }
      @keyframes draw-motion-default {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; }
      }
    [fill="#0B0B0C"].draw { animation-name: draw-motion-0; }
    [fill="#FFFFFF"].draw { animation-name: draw-motion-1; }
  </style>

  <rect class="draw" width="64" height="64" rx="14" fill="#0B0B0C" stroke="#0B0B0C" />
  <g transform="translate(10 24.2) scale(1.735)">
