<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .draw {
      fill: transparent;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: draw-html-default 3s linear infinite;
    }
      @keyframes draw-html-0 {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; fill: #E44D26; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: #E44D26; }
      }
      @keyframes draw-html-1 {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; fill: #F16529; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: #F16529; }
      }
      @keyframes draw-html-2 {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; fill: #EBEBEB; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: #EBEBEB; }
      }
      @keyframes draw-html-3 {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; fill: #fff; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: #fff; }
      }
      @keyframes draw-html-default {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; }
      }
    [fill="#E44D26"].draw { animation-name: draw-html-0; }
    [fill="#F16529"].draw { animation-name: draw-html-1; }
    [fill="#EBEBEB"].draw { animation-name: draw-html-2; }
    [fill="#fff"].draw { animation-name: draw-html-3; }
  </style>
