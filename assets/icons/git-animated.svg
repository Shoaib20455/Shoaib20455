<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="git"><title>git</title><desc>A commit travels to each endpoint along Git’s white branches on its orange diamond.</desc><defs><style>@keyframes git-branch-commit {0%,10%,100%{transform:translate(0,0)}35%{transform:translate(0,9px)}55%{transform:translate(0,0)}80%{transform:translate(5.5px,5.5px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .motion-trail { opacity: 0; } }</style></defs><g transform="translate(10 10) scale(4.5)" fill="#334155"><rect x="3.5" y="3.5" width="17" height="17" rx="1.7" transform="rotate(45 12 12)" fill="#f05032" /><path d="M8 6 L15.5 13.5 M10 8 V17" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" /><circle cx="10" cy="8" r="1.65" fill="#fff" /><circle cx="15.5" cy="13.5" r="1.65" fill="#fff" /><circle cx="10" cy="17" r="1.65" fill="#fff" /><circle cx="10" cy="8" r="0.9" fill="#ffd5ca" class="motion-trail" style="animation:git-branch-commit 6s ease-in-out 0s infinite;" /></g></svg>
