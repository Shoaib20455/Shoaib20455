<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .draw {
      fill: transparent;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: draw-css-default 3s linear infinite;
    }
      @keyframes draw-css-0 {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; fill: #1572B6; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: #1572B6; }
      }
      @keyframes draw-css-1 {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; fill: #33A9DC; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: #33A9DC; }
      }
      @keyframes draw-css-2 {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; fill: #fff; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: #fff; }
      }
      @keyframes draw-css-3 {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; fill: #EBEBEB; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: #EBEBEB; }
      }
      @keyframes draw-css-default {
        0% { stroke-dasharray: 0 2000; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; fill: transparent; }
        75%, 100% { stroke-dasharray: 2000 2000; stroke-dashoffset: 0; }
      }
    [fill="#1572B6"].draw { animation-name: draw-css-0; }
    [fill="#33A9DC"].draw { animation-name: draw-css-1; }
    [fill="#fff"].draw { animation-name: draw-css-2; }
    [fill="#EBEBEB"].draw { animation-name: draw-css-3; }
  </style>
